<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Ember & Salt Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<script src="../js/debug-overlay.js"></script>
<script type="module">
  import { initAdminPage } from '../js/admin/layout.js';
  import { showToast, formatCurrency } from '../js/modules/ui.js';
  import { db, collection, onSnapshot } from '../js/firebase/config.js';

  let currentOrders = [];

  initAdminPage('reports.html').then(async ({ content }) => {
    content.innerHTML = `
      <div class="flex justify-between items-center" style="margin-bottom:var(--sp-6)">
        <h1 class="font-display" style="font-size:var(--text-2xl)">Reports</h1>
        <span class="badge badge-success" id="live-badge">● Live</span>
      </div>
      <div class="card" style="margin-bottom:var(--sp-6)">
        <h3 class="font-display" style="font-size:var(--text-lg);margin-bottom:var(--sp-4)">Sales summary</h3>
        <div class="stat-grid" id="sales-stats"></div>
      </div>
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:var(--sp-4)">
          <h3 class="font-display" style="font-size:var(--text-lg)">Order export</h3>
          <button class="btn btn-outline btn-sm" id="export-csv">Export CSV</button>
        </div>
        <table class="data-table"><thead><tr><th>Date</th><th>Customer</th><th>Type</th><th>Status</th><th>Total</th></tr></thead><tbody id="orders-body"></tbody></table>
      </div>
      <div id="reports-error"></div>`;

    onSnapshot(collection(db, 'orders'), (snap) => {
      currentOrders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      render();
    }, (err) => {
      console.error(err);
      document.getElementById('live-badge').outerHTML = `<span class="badge badge-danger">● Offline</span>`;
      document.getElementById('reports-error').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Couldn't load orders (${err.code || err.message}). Report figures below may be incomplete.</div>`;
    });

    document.getElementById('export-csv').addEventListener('click', () => {
      if (!currentOrders.length) { showToast('Nothing to export yet', 'error'); return; }
      const rows = [['Order ID','Date','Customer','Email','Type','Status','Payment','Subtotal','Discount','Tax','Total']];
      currentOrders.forEach(o => rows.push([o.id, o.createdAt?.toDate ? o.createdAt.toDate().toISOString() : '', o.customerName||'', o.customerEmail||'', o.orderType||'', o.status||'', o.paymentStatus||'', o.subtotal||0, o.discount||0, o.tax||0, o.total||0]));
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `sales-report-${new Date().toISOString().split('T')[0]}.csv`; a.click();
      showToast('CSV exported', 'success');
    });
  });

  function render() {
    const orders = currentOrders;
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startOfWeek = new Date(startOfDay); startOfWeek.setDate(startOfDay.getDate() - startOfDay.getDay());
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    const startOfYear = new Date(now.getFullYear(), 0, 1);

    const sumSince = (d) => orders.filter(o => o.status !== 'cancelled' && o.createdAt?.toDate && o.createdAt.toDate() >= d).reduce((s,o)=>s+(o.total||0),0);

    document.getElementById('sales-stats').innerHTML = [
      { label: 'Today', value: formatCurrency(sumSince(startOfDay)) },
      { label: 'This week', value: formatCurrency(sumSince(startOfWeek)) },
      { label: 'This month', value: formatCurrency(sumSince(startOfMonth)) },
      { label: 'This year', value: formatCurrency(sumSince(startOfYear)) },
    ].map(s => `<div class="stat-card"><div class="text-muted" style="font-size:var(--text-xs);text-transform:uppercase">${s.label}</div><div class="stat-value">${s.value}</div></div>`).join('');

    document.getElementById('orders-body').innerHTML = orders.slice(0, 100).map(o => `
      <tr><td>${o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString() : '—'}</td><td>${o.customerName||o.customerEmail||'Guest'}</td><td>${(o.orderType||'').replace('_',' ')}</td><td><span class="badge badge-muted">${o.status}</span></td><td>${formatCurrency(o.total)}</td></tr>`).join('');
  }
</script>
</body>
</html>
