<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Ember & Salt Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<script src="../js/debug-overlay.js"></script>
<script type="module">
  import { initAdminPage } from '../js/admin/layout.js';
  import { skeletonCards, formatCurrency } from '../js/modules/ui.js';
  import { db, collection, onSnapshot, query, where } from '../js/firebase/config.js';

  initAdminPage('dashboard.html').then(async ({ content }) => {
    content.innerHTML = `
      <div class="flex justify-between items-center" style="margin-bottom:var(--sp-6)">
        <h1 class="font-display" style="font-size:var(--text-2xl)">Dashboard</h1>
        <span class="badge badge-success" id="live-badge">● Live</span>
      </div>
      <div class="stat-grid" id="stats">${skeletonCards(4, '110px')}</div>
      <div class="admin-grid-2" id="lower-grid">
        <div class="card"><h3 class="font-display" style="font-size:var(--text-lg);margin-bottom:var(--sp-2)">Revenue — last 7 days</h3><div class="bar-chart" id="revenue-chart" style="margin-bottom:var(--sp-6)"></div></div>
        <div class="card"><h3 class="font-display" style="font-size:var(--text-lg);margin-bottom:var(--sp-4)">Popular meals</h3><div id="popular-meals"></div></div>
      </div>
      <div class="admin-grid-2-even" style="margin-top:var(--sp-6)">
        <div class="card"><h3 class="font-display" style="font-size:var(--text-lg);margin-bottom:var(--sp-4)">Order pipeline</h3><div id="pipeline"></div></div>
        <div class="card"><h3 class="font-display" style="font-size:var(--text-lg);margin-bottom:var(--sp-4)">Today's reservations</h3><div id="today-res"></div></div>
      </div>
      <div id="dash-error"></div>`;

    // Cache of the three live collections; every listener update recomputes
    // the whole dashboard from whatever's currently cached so nothing goes
    // stale and nothing needs page reloads to reflect new orders/bookings.
    const cache = { orders: null, reservations: null, customers: null };

    function onError(label) {
      return (err) => {
        console.error(err);
        document.getElementById('live-badge').outerHTML = `<span class="badge badge-danger">● Offline</span>`;
        document.getElementById('dash-error').innerHTML =
          `<div class="empty-state"><div class="icon">⚠️</div>Couldn't load ${label} (${err.code || err.message}). Dashboard numbers may be incomplete — this is surfaced, not hidden, so you know to check your connection or Firestore rules.</div>`;
      };
    }

    onSnapshot(collection(db, 'orders'), (snap) => {
      cache.orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, onError('orders'));

    onSnapshot(collection(db, 'reservations'), (snap) => {
      cache.reservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, onError('reservations'));

    onSnapshot(query(collection(db, 'users'), where('role', '==', 'customer')), (snap) => {
      cache.customers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, onError('customers'));

    function render() {
      // Wait until every collection has reported at least once, so early
      // partial renders don't flash misleading zeros.
      if (!cache.orders || !cache.reservations || !cache.customers) return;
      const { orders, reservations, customers } = cache;

      const revenue = orders.filter(o => o.status !== 'cancelled').reduce((s, o) => s + (o.total || 0), 0);

      document.getElementById('stats').innerHTML = [
        { label: 'Total Revenue', value: formatCurrency(revenue) },
        { label: 'Orders', value: orders.length },
        { label: 'Reservations', value: reservations.length },
        { label: 'Customers', value: customers.length },
      ].map(s => `<div class="stat-card"><div class="text-muted" style="font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em">${s.label}</div><div class="stat-value">${s.value}</div></div>`).join('');

      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const byDay = new Array(7).fill(0);
      orders.forEach(o => { if (o.createdAt?.toDate) byDay[o.createdAt.toDate().getDay()] += (o.total || 0); });
      const max = Math.max(...byDay, 1);
      document.getElementById('revenue-chart').innerHTML = byDay.map((v, i) => `<div class="bar" style="height:${Math.max((v/max)*140,4)}px"><span class="bar-label">${days[i]}</span></div>`).join('');

      const mealCounts = {};
      orders.forEach(o => (o.items || []).forEach(i => { mealCounts[i.name] = (mealCounts[i.name] || 0) + i.qty; }));
      const top = Object.entries(mealCounts).sort((a,b) => b[1]-a[1]).slice(0,5);
      document.getElementById('popular-meals').innerHTML = top.length ? top.map(([name, qty]) => `
        <div class="flex justify-between" style="padding:var(--sp-2) 0;border-bottom:1px solid var(--color-line)"><span>${name}</span><strong class="mono">${qty}×</strong></div>`).join('') : `<div class="empty-state"><div class="icon">🍽️</div>No orders yet.</div>`;

      const statuses = ['pending','accepted','preparing','ready','out_for_delivery','delivered'];
      document.getElementById('pipeline').innerHTML = statuses.map(s => {
        const count = orders.filter(o => o.status === s).length;
        return `<div class="flex justify-between items-center" style="padding:var(--sp-2) 0"><span class="text-muted" style="text-transform:capitalize">${s.replace('_',' ')}</span><span class="badge badge-ember">${count}</span></div>`;
      }).join('');

      const todayStr = new Date().toISOString().split('T')[0];
      const todays = reservations.filter(r => r.date === todayStr && r.status !== 'cancelled');
      document.getElementById('today-res').innerHTML = todays.length ? todays.map(r => `
        <div class="flex justify-between" style="padding:var(--sp-2) 0;border-bottom:1px solid var(--color-line)"><span>${r.time} — ${r.customerName || 'Guest'}</span><span class="text-muted">${r.guests} guests</span></div>`).join('') : `<div class="empty-state"><div class="icon">📅</div>No reservations today.</div>`;
    }
  });
</script>
</body>
</html>
