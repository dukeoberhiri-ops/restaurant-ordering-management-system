<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Management — Ember & Salt Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<script src="../js/debug-overlay.js"></script>
<script type="module">
  import { initAdminPage } from '../js/admin/layout.js';
  import { showToast, confirmDialog, formatCurrency, formatDateTime, escapeHtml, openModal } from '../js/modules/ui.js';
  import { db, collection, onSnapshot, doc, updateDoc, query, orderBy, arrayUnion } from '../js/firebase/config.js';

  const COLUMNS = [
    { key: 'pending', label: 'Received', next: 'accepted' },
    { key: 'accepted', label: 'Accepted', next: 'preparing' },
    { key: 'preparing', label: 'Preparing', next: 'ready' },
    { key: 'ready', label: 'Ready', next: 'delivered' },
    { key: 'delivered', label: 'Delivered / Done', next: null },
  ];

  let orders = [];

  initAdminPage('orders.html').then(({ content }) => {
    content.innerHTML = `
      <h1 class="font-display" style="font-size:var(--text-2xl);margin-bottom:var(--sp-6)">Order Management</h1>
      <div class="order-board" id="order-board"></div>`;

    onSnapshot(query(collection(db, 'orders'), orderBy('createdAt', 'desc')), (snap) => {
      orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => { console.error(err); content.insertAdjacentHTML('beforeend', `<div class="empty-state"><div class="icon">⚠️</div>Couldn't load orders.</div>`); });
  });

  function render() {
    const board = document.getElementById('order-board');
    board.innerHTML = COLUMNS.map(col => {
      const items = orders.filter(o => o.status === col.key);
      return `
        <div class="order-col">
          <h4>${col.label} <span class="mono">${items.length}</span></h4>
          ${items.length ? items.map(o => `
            <div class="order-ticket" data-view="${o.id}">
              <div class="flex justify-between" style="margin-bottom:var(--sp-1)"><strong>#${o.id.slice(0,6).toUpperCase()}</strong><span class="mono">${formatCurrency(o.total)}</span></div>
              <div class="text-muted" style="font-size:var(--text-xs)">${(o.orderType||'').replace('_',' ')} · ${(o.items||[]).length} items</div>
              <div class="text-muted" style="font-size:var(--text-xs)">${o.customerName || o.customerEmail || 'Guest'}</div>
              <div class="flex gap-2" style="margin-top:var(--sp-3)">
                ${col.next ? `<button class="btn btn-primary btn-sm" data-advance="${o.id}" data-next="${col.next}" style="flex:1">${col.next === 'accepted' ? 'Accept' : 'Mark ' + col.next.replace('_',' ')}</button>` : ''}
                ${col.key === 'pending' ? `<button class="btn btn-ghost btn-sm" data-reject="${o.id}" style="color:var(--color-danger)">Reject</button>` : ''}
              </div>
            </div>`).join('') : `<div class="text-muted" style="font-size:var(--text-sm);text-align:center;padding:var(--sp-6) 0">Empty</div>`}
        </div>`;
    }).join('');

    board.querySelectorAll('[data-advance]').forEach(b => b.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await updateDoc(doc(db, 'orders', b.dataset.advance), {
          status: b.dataset.next,
          statusHistory: arrayUnion({ status: b.dataset.next, at: new Date().toISOString() })
        });
        showToast('Order updated', 'success');
      } catch (err) {
        console.error(err);
        showToast('Could not update order: ' + (err.code || err.message), 'error');
      }
    }));
    board.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await confirmDialog({ title: 'Reject this order?', message: 'The customer will be notified.', confirmLabel: 'Reject order', danger: true });
      if (!ok) return;
      try {
        await updateDoc(doc(db, 'orders', b.dataset.reject), {
          status: 'cancelled',
          statusHistory: arrayUnion({ status: 'cancelled', at: new Date().toISOString() })
        });
        showToast('Order rejected', 'info');
      } catch (err) {
        console.error(err);
        showToast('Could not reject order: ' + (err.code || err.message), 'error');
      }
    }));
    board.querySelectorAll('[data-view]').forEach(el => el.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      showOrderDetail(orders.find(o => o.id === el.dataset.view));
    }));
  }

  function showOrderDetail(o) {
    openModal(`
      <div class="modal-header"><h3 class="font-display">Order #${o.id.slice(0,8).toUpperCase()}</h3><button class="modal-close" data-close-modal>&times;</button></div>
      <p class="text-muted" style="margin-bottom:var(--sp-4)">${o.createdAt ? formatDateTime(o.createdAt) : ''} · ${o.customerName || o.customerEmail}</p>
      ${(o.items||[]).map(i => `<div class="flex justify-between" style="padding:var(--sp-2) 0;border-bottom:1px solid var(--color-line);font-size:var(--text-sm)"><span>${i.qty} × ${escapeHtml(i.name)}</span><span>${formatCurrency(i.qty*i.price)}</span></div>`).join('')}
      <div class="flex justify-between" style="font-weight:700;padding-top:var(--sp-3)"><span>Total</span><span>${formatCurrency(o.total)}</span></div>
      ${o.notes ? `<p style="margin-top:var(--sp-4)"><strong>Notes:</strong> ${escapeHtml(o.notes)}</p>` : ''}
      ${o.deliveryAddress ? `<p style="margin-top:var(--sp-2)"><strong>Deliver to:</strong> ${escapeHtml(o.deliveryAddress)}</p>` : ''}
      ${o.tableNumber ? `<p style="margin-top:var(--sp-2)"><strong>Table:</strong> ${escapeHtml(o.tableNumber)}</p>` : ''}
      <div class="field" style="margin-top:var(--sp-4)">
        <label>Payment status</label>
        <select class="input" id="pay-status">
          <option value="unpaid" ${o.paymentStatus==='unpaid'?'selected':''}>Unpaid</option>
          <option value="paid" ${o.paymentStatus==='paid'?'selected':''}>Paid</option>
          <option value="refunded" ${o.paymentStatus==='refunded'?'selected':''}>Refunded</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="save-pay">Save</button>
    `);
    document.getElementById('save-pay').addEventListener('click', async () => {
      try {
        await updateDoc(doc(db, 'orders', o.id), { paymentStatus: document.getElementById('pay-status').value });
        showToast('Payment status updated', 'success');
      } catch (err) {
        console.error(err);
        showToast('Could not update payment status: ' + (err.code || err.message), 'error');
      }
    });
  }
</script>
</body>
</html>
