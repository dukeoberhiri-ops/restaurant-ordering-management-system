<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Tools — Ember & Salt Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .demo-log { font-family: var(--font-mono); font-size: var(--text-sm); white-space: pre-wrap; background: var(--color-bg-sunken); border-radius: var(--radius-md); padding: var(--sp-4); max-height: 320px; overflow-y: auto; margin-top: var(--sp-5); }
</style>
</head>
<body>
<script src="../js/debug-overlay.js"></script>
<script type="module">
  import { initAdminPage } from '../js/admin/layout.js';
  import { showToast, confirmDialog } from '../js/modules/ui.js';
  import { db, collection, query, where, getDocs, limit } from '../js/firebase/config.js';
  import { DEMO_ADMIN_EMAIL, DEMO_USER_EMAIL, seedAllDemoData, resetDemoData } from '../js/modules/demo-auth.js';

  let content, log, user;

  initAdminPage('demo-data.html').then(async (ctx) => {
    content = ctx.content; user = ctx.user;

    // Hard guard, independent of the sidebar link: gated by exact email, not
    // role, so a real client's own admin account can never reach these
    // controls even by navigating here directly.
    if (user.email !== DEMO_ADMIN_EMAIL) {
      content.innerHTML = `<div class="empty-state"><div class="icon">🔒</div>This page is restricted to the demo environment.</div>`;
      return;
    }

    content.innerHTML = `
      <h1 class="font-display" style="font-size:var(--text-2xl);margin-bottom:var(--sp-2)">Demo Tools</h1>
      <p class="text-muted" style="margin-bottom:var(--sp-6)">You're signed in as the Demo Admin. Sample data is normally seeded automatically the first time anyone uses "Login as Demo" — use these controls if you want to force a clean reset.</p>

      <div class="card" style="display:flex;gap:var(--sp-4);align-items:flex-start;margin-bottom:var(--sp-5)">
        <span style="font-size:1.8rem">🔗</span>
        <div>
          <h3 style="margin-bottom:var(--sp-2)">How the demo accounts connect</h3>
          <p class="text-muted" style="font-size:var(--text-sm)">Every seeded order and reservation is owned by the real <strong>Demo User</strong> account (<span class="mono">${DEMO_USER_EMAIL}</span>), not a fake record — so switching between "Login as Demo Admin" and "Login as Demo User" shows a genuine two-sided relationship: the guest's own order history on one side, and this admin's live kanban board and dashboard on the other.</p>
        </div>
      </div>

      <div class="grid-2" style="gap:var(--sp-5)">
        <div class="card">
          <h3 style="margin-bottom:var(--sp-2)">Seed Demo Data</h3>
          <p class="text-muted" style="font-size:var(--text-sm);margin-bottom:var(--sp-4)">Adds the menu, 15 orders, and 8 reservations if they don't already exist. Safe to click even if already seeded — it skips instead of duplicating.</p>
          <button class="btn btn-outline btn-block" id="seed-btn">Seed Demo Data</button>
        </div>
        <div class="card" style="border-color:var(--color-danger)">
          <h3 style="color:var(--color-danger);margin-bottom:var(--sp-2)">Reset Demo Data</h3>
          <p class="text-muted" style="font-size:var(--text-sm);margin-bottom:var(--sp-4)">Wipes every demo-tagged document across the whole app and reseeds clean. Demo accounts and their Auth logins are untouched.</p>
          <button class="btn btn-outline btn-block" id="reset-btn" style="color:var(--color-danger);border-color:var(--color-danger)">Reset Demo Data</button>
        </div>
      </div>

      <div class="demo-log" id="log" style="display:none"></div>`;

    log = document.getElementById('log');

    document.getElementById('seed-btn').addEventListener('click', async () => {
      runTask(async () => {
        const demoUserUid = await getDemoUserUid();
        await seedAllDemoData(demoUserUid, write);
      });
    });

    document.getElementById('reset-btn').addEventListener('click', async () => {
      const ok = await confirmDialog({ title: 'Reset demo data?', message: 'This deletes every demo-tagged menu item, order, and reservation, then reseeds clean. This cannot be undone.', confirmLabel: 'Reset demo data', danger: true });
      if (ok) runTask(() => resetDemoData(write));
    });
  });

  async function getDemoUserUid() {
    const snap = await getDocs(query(collection(db, 'users'), where('email', '==', DEMO_USER_EMAIL), limit(1)));
    if (snap.empty) throw new Error('Demo User account not found yet — log in as Demo User at least once first.');
    return snap.docs[0].id;
  }

  async function runTask(fn) {
    log.style.display = 'block';
    log.textContent = '';
    write('Working…');
    try {
      await fn();
      write('Done.');
      showToast('Demo data updated', 'success');
    } catch (err) {
      console.error(err);
      write('Error: ' + (err.code || err.message));
      showToast('Something went wrong — see the log below', 'error');
    }
  }
  function write(msg) { log.textContent += msg + '\n'; log.scrollTop = log.scrollHeight; }
</script>
</body>
</html>
