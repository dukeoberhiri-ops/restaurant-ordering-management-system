<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Ember & Salt Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .msg-row { display: grid; grid-template-columns: auto 1fr auto; gap: var(--sp-4); align-items: center; padding: var(--sp-4); border: 1px solid var(--color-line); border-radius: var(--radius-md); margin-bottom: var(--sp-3); cursor: pointer; }
  .msg-row:hover { border-color: var(--color-ember); }
  .msg-row.unread { border-left: 3px solid var(--color-ember); }
  @media (max-width: 640px) { .msg-row { grid-template-columns: 1fr; text-align: left; } }
</style>
</head>
<body>
<script src="../js/debug-overlay.js"></script>
<script type="module">
  import { initAdminPage } from '../js/admin/layout.js';
  import { showToast, formatDateTime, escapeHtml, openModal } from '../js/modules/ui.js';
  import { db, collection, onSnapshot, doc, updateDoc, serverTimestamp } from '../js/firebase/config.js';

  let messages = [];

  initAdminPage('messages.html').then(({ content }) => {
    content.innerHTML = `
      <div class="flex justify-between items-center" style="margin-bottom:var(--sp-6)">
        <h1 class="font-display" style="font-size:var(--text-2xl)">Messages</h1>
        <span class="badge badge-success" id="live-badge">● Live</span>
      </div>
      <div id="msg-list"></div>`;

    onSnapshot(collection(db, 'messages'), (snap) => {
      messages = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      render();
    }, (err) => {
      console.error(err);
      document.getElementById('live-badge').outerHTML = `<span class="badge badge-danger">● Offline</span>`;
      document.getElementById('msg-list').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Couldn't load messages (${err.code || err.message}).</div>`;
    });
  });

  function render() {
    const wrap = document.getElementById('msg-list');
    if (!messages.length) { wrap.innerHTML = `<div class="empty-state"><div class="icon">💬</div>No messages yet.</div>`; return; }
    wrap.innerHTML = messages.map(m => `
      <div class="msg-row ${m.status === 'new' ? 'unread' : ''}" data-open="${m.id}">
        <div>
          <div style="font-weight:600">${escapeHtml(m.name)}</div>
          <div class="text-muted" style="font-size:var(--text-xs)">${escapeHtml(m.email)}</div>
        </div>
        <div class="text-muted" style="font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(m.message)}</div>
        <div class="flex gap-2 items-center">
          <span class="badge ${m.status === 'new' ? 'badge-ember' : m.status === 'replied' ? 'badge-success' : 'badge-muted'}">${m.status}</span>
          <span class="text-muted" style="font-size:var(--text-xs)">${m.createdAt ? formatDateTime(m.createdAt) : ''}</span>
        </div>
      </div>`).join('');
    wrap.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openMessage(messages.find(m => m.id === el.dataset.open))));
  }

  function openMessage(m) {
    if (m.status === 'new') updateDoc(doc(db, 'messages', m.id), { status: 'read' }).catch(err => console.warn('Could not mark as read', err));
    const { close } = openModal(`
      <div class="modal-header"><h3 class="font-display">${escapeHtml(m.name)}</h3><button class="modal-close" data-close-modal>&times;</button></div>
      <p class="text-muted" style="margin-bottom:var(--sp-4)">${escapeHtml(m.email)} · ${m.createdAt ? formatDateTime(m.createdAt) : ''}</p>
      <p style="margin-bottom:var(--sp-5);white-space:pre-wrap">${escapeHtml(m.message)}</p>
      ${m.adminReply ? `<div class="card" style="background:var(--color-bg-sunken);margin-bottom:var(--sp-4)"><div class="text-muted" style="font-size:var(--text-xs);margin-bottom:var(--sp-2)">Your reply</div>${escapeHtml(m.adminReply)}</div>` : ''}
      <div class="field"><label>${m.adminReply ? 'Update reply' : 'Write a reply'}</label><textarea class="input" id="reply-text" rows="4">${m.adminReply ? escapeHtml(m.adminReply) : ''}</textarea></div>
      <button class="btn btn-primary btn-block" id="send-reply">Send Reply</button>
    `);
    document.getElementById('send-reply').addEventListener('click', async () => {
      const reply = document.getElementById('reply-text').value.trim();
      if (!reply) { showToast('Write a reply first', 'error'); return; }
      try {
        await updateDoc(doc(db, 'messages', m.id), { adminReply: reply, status: 'replied', repliedAt: serverTimestamp() });
        showToast('Reply sent', 'success');
        close();
      } catch (err) {
        console.error(err);
        showToast('Could not send reply: ' + (err.code || err.message), 'error');
      }
    });
  }
</script>
</body>
</html>
