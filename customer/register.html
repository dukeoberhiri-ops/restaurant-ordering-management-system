<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Ember & Salt</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--color-bg-sunken); padding: var(--sp-5); }
  .auth-card { width: 100%; max-width: 440px; background: var(--color-bg-raised); border-radius: var(--radius-lg); padding: var(--sp-8); box-shadow: var(--shadow-md); }
  .auth-logo { text-align: center; margin-bottom: var(--sp-6); }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="../index.html" class="logo">Ember<span class="accent">&</span>Salt</a>
      <p class="text-muted" style="margin-top:var(--sp-2)">Create your account</p>
    </div>
    <form id="register-form" novalidate>
      <div class="field" id="name-field">
        <label for="name">Full name</label>
        <input class="input" id="name" required autocomplete="name">
        <span class="error-text">Enter your name.</span>
      </div>
      <div class="field" id="email-field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" required autocomplete="email">
        <span class="error-text">Enter a valid email address.</span>
      </div>
      <div class="field" id="phone-field">
        <label for="phone">Phone <span class="text-muted">(optional)</span></label>
        <input class="input" type="tel" id="phone" autocomplete="tel">
      </div>
      <div class="field" id="password-field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" required autocomplete="new-password">
        <span class="hint">At least 8 characters.</span>
        <span class="error-text">Password must be at least 8 characters.</span>
      </div>
      <div class="field" id="confirm-field">
        <label for="confirm">Confirm password</label>
        <input class="input" type="password" id="confirm" required autocomplete="new-password">
        <span class="error-text">Passwords don't match.</span>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="submit-btn">Create Account</button>
    </form>
    <p class="text-center text-muted" style="margin-top:var(--sp-6);font-size:var(--text-sm)">
      Already have an account? <a href="login.html" style="color:var(--color-ember);font-weight:600">Sign in</a>
    </p>
  </div>
</div>

<script type="module">
  import { initTheme, showToast } from '../js/modules/ui.js';
  import { registerCustomer } from '../js/modules/auth.js';
  initTheme();

  const form = document.getElementById('register-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    let valid = true;
    toggleError('name-field', !name);
    if (!name) valid = false;
    toggleError('email-field', !email.includes('@'));
    if (!email.includes('@')) valid = false;
    toggleError('password-field', password.length < 8);
    if (password.length < 8) valid = false;
    toggleError('confirm-field', confirm !== password);
    if (confirm !== password) valid = false;
    if (!valid) return;

    submitBtn.disabled = true; submitBtn.textContent = 'Creating account…';
    try {
      await registerCustomer({ name, email, password, phone });
      showToast('Account created — welcome!', 'success');
      setTimeout(() => { window.location.href = 'account.html'; }, 500);
    } catch (err) {
      showToast(friendlyError(err), 'error');
      submitBtn.disabled = false; submitBtn.textContent = 'Create Account';
    }
  });

  function toggleError(id, isError) { document.getElementById(id).classList.toggle('has-error', isError); }
  function friendlyError(err) {
    const msg = err.code || err.message || '';
    if (msg.includes('email-already-in-use')) return 'An account with this email already exists.';
    if (msg.includes('weak-password')) return 'Please choose a stronger password.';
    return err.message || 'Something went wrong.';
  }
</script>
</body>
</html>
