<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Ember & Salt</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
  .order-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: var(--sp-4); align-items: center; padding: var(--sp-4); border: 1px solid var(--color-line); border-radius: var(--radius-md); margin-bottom: var(--sp-3); }
  @media (max-width: 640px) { .order-row { grid-template-columns: 1fr; text-align: left; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="container flex items-center justify-between" style="width:100%">
    <a href="../index.html" class="logo">Ember<span class="accent">&</span>Salt</a>
    <nav class="nav-links"><a href="menu.html">Menu</a><a href="account.html">Account</a></nav>
    <div class="nav-cta"><button class="theme-toggle" data-theme-toggle>🌙</button></div>
  </div>
</header>

<main class="section">
  <div class="container" style="max-width:760px">
    <h1 class="font-display" style="font-size:var(--text-2xl);margin-bottom:var(--sp-6)">My Orders</h1>
    <div id="orders-list"><div class="skeleton" style="height:300px"></div></div>
  </div>
</main>

<script type="module">
  import { initTheme, formatCurrency, formatDateTime, openModal, escapeHtml } from '../js/modules/ui.js';
  import { requireAuth } from '../js/modules/auth.js';
  import { db, collection, query, where, getDocs } from '../js/firebase/config.js';
  initTheme();

  const STATUS_BADGE = { pending:'badge-warning', accepted:'badge-gold', preparing:'badge-gold', ready:'badge-olive', out_for_delivery:'badge-olive', delivered:'badge-success', cancelled:'badge-danger' };

  requireAuth().then(async ({ user }) => {
    const wrap = document.getElementById('orders-list');
    try {
      const snap = await getDocs(query(collection(db, 'orders'), where('userId', '==', user.uid)));
      const orders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
      if (!orders.length) { wrap.innerHTML = `<div class="empty-state"><div class="icon">🧾</div>No orders yet.<br><a href="menu.html" class="btn btn-primary" style="margin-top:var(--sp-4)">Order now</a></div>`; return; }
      wrap.innerHTML = orders.map(o => `
        <div class="order-row">
          <div class="mono text-muted">#${o.id.slice(0,8).toUpperCase()}</div>
          <div>
            <div style="font-weight:600">${(o.items||[]).length} items · ${(o.orderType||'').replace('_',' ')}</div>
            <div class="text-muted" style="font-size:var(--text-xs)">${o.createdAt ? formatDateTime(o.createdAt) : ''}</div>
          </div>
          <span class="badge ${STATUS_BADGE[o.status] || 'badge-muted'}">${(o.status||'').replace('_',' ')}</span>
          <div class="flex gap-2">
            <strong>${formatCurrency(o.total)}</strong>
            <button class="btn btn-ghost btn-sm" data-invoice="${o.id}">Invoice</button>
            <a href="order-track.html?id=${o.id}" class="btn btn-outline btn-sm">Track</a>
          </div>
        </div>`).join('');
      wrap.querySelectorAll('[data-invoice]').forEach(b => b.addEventListener('click', () => showInvoice(orders.find(o => o.id === b.dataset.invoice))));
    } catch (err) { console.error(err); wrap.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Couldn't load your orders.</div>`; }
  });

  function showInvoice(o) {
    openModal(`
      <div class="modal-header"><h3 class="font-display">Invoice #${o.id.slice(0,8).toUpperCase()}</h3><button class="modal-close" data-close-modal>&times;</button></div>
      <p class="text-muted" style="margin-bottom:var(--sp-4)">${o.createdAt ? formatDateTime(o.createdAt) : ''}</p>
      ${(o.items||[]).map(i => `<div class="flex justify-between" style="padding:var(--sp-2) 0;border-bottom:1px solid var(--color-line);font-size:var(--text-sm)"><span>${i.qty} × ${escapeHtml(i.name)}</span><span>${formatCurrency(i.qty*i.price)}</span></div>`).join('')}
      <div class="flex justify-between" style="padding-top:var(--sp-3)"><span>Subtotal</span><span>${formatCurrency(o.subtotal)}</span></div>
      ${o.discount ? `<div class="flex justify-between" style="color:var(--color-success)"><span>Discount</span><span>-${formatCurrency(o.discount)}</span></div>` : ''}
      ${o.deliveryFee ? `<div class="flex justify-between"><span>Delivery</span><span>${formatCurrency(o.deliveryFee)}</span></div>` : ''}
      <div class="flex justify-between"><span>Tax</span><span>${formatCurrency(o.tax)}</span></div>
      <div class="flex justify-between" style="font-weight:700;font-size:var(--text-lg);border-top:1px solid var(--color-line-strong);padding-top:var(--sp-3);margin-top:var(--sp-2)"><span>Total</span><span>${formatCurrency(o.total)}</span></div>
      <p class="text-muted" style="font-size:var(--text-xs);margin-top:var(--sp-4)">Payment status: ${o.paymentStatus || 'unpaid'}</p>
    `);
  }
</script>
</body>
</html>
