<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservations — Ember & Salt</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
  .res-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-8); align-items: start; }
  @media (max-width: 900px) { .res-layout { grid-template-columns: 1fr; } }
  .guest-stepper { display: flex; align-items: center; gap: var(--sp-4); }
  .guest-stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--color-line-strong); font-weight: 700; background: var(--color-bg-raised); }
  .res-item { padding: var(--sp-4); border: 1px solid var(--color-line); border-radius: var(--radius-md); margin-bottom: var(--sp-3); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container flex items-center justify-between" style="width:100%">
    <a href="../index.html" class="logo">Ember<span class="accent">&</span>Salt</a>
    <nav class="nav-links"><a href="menu.html">Menu</a><a href="reservations.html" class="active">Reservations</a></nav>
    <div class="nav-cta">
      <button class="theme-toggle" data-theme-toggle>🌙</button>
      <a href="login.html" id="account-link" class="icon-btn">👤</a>
      <button class="mobile-menu-btn icon-btn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main class="section">
  <div class="container res-layout">
    <div class="card">
      <span class="eyebrow">Book a table</span>
      <h1 class="font-display" style="font-size:var(--text-2xl);margin:var(--sp-3) 0 var(--sp-6)">Reserve your table</h1>
      <form id="res-form" novalidate>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:var(--sp-4)">
          <div class="field" id="date-field">
            <label for="res-date">Date</label>
            <input class="input" type="date" id="res-date" required>
            <span class="error-text">Choose a date.</span>
          </div>
          <div class="field" id="time-field">
            <label for="res-time">Time</label>
            <select class="input" id="res-time" required></select>
            <span class="error-text">Choose a time.</span>
          </div>
        </div>
        <div class="field">
          <label>Guests</label>
          <div class="guest-stepper">
            <button type="button" id="guest-dec">−</button>
            <span id="guest-count" style="font-weight:700;font-size:var(--text-lg)">2</span>
            <button type="button" id="guest-inc">+</button>
          </div>
        </div>
        <div class="field">
          <label for="res-notes">Notes <span class="text-muted">(optional)</span></label>
          <textarea class="input" id="res-notes" placeholder="Birthday, allergies, seating preference…"></textarea>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="res-submit">Confirm Reservation</button>
        <p class="text-muted" style="font-size:var(--text-xs);text-align:center;margin-top:var(--sp-3)">Sign in required to hold a table — you'll be prompted at submit if needed.</p>
      </form>
    </div>

    <div>
      <h3 class="font-display" style="font-size:var(--text-xl);margin-bottom:var(--sp-4)">Your reservations</h3>
      <div id="my-reservations"><div class="empty-state"><div class="icon">📅</div>Sign in to see your bookings.</div></div>
    </div>
  </div>
</main>

<script type="module">
  import { initTheme, showToast, formatDate, confirmDialog, escapeHtml, initMobileNav } from '../js/modules/ui.js';
  import { watchAuth } from '../js/modules/auth.js';
  import { db, collection, addDoc, query, where, onSnapshot, updateDoc, doc, orderBy, serverTimestamp, runTransaction, getDocs, increment } from '../js/firebase/config.js';

  initTheme();
  initMobileNav();

  const TIMES = ['5:00 PM','5:30 PM','6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM','9:00 PM','9:30 PM'];
  const timeSelect = document.getElementById('res-time');
  timeSelect.innerHTML = TIMES.map(t => `<option value="${t}">${t}</option>`).join('');
  document.getElementById('res-date').min = new Date().toISOString().split('T')[0];
  document.getElementById('res-date').value = new Date().toISOString().split('T')[0];

  let guests = 2;
  document.getElementById('guest-inc').addEventListener('click', () => { guests = Math.min(guests+1, 20); document.getElementById('guest-count').textContent = guests; });
  document.getElementById('guest-dec').addEventListener('click', () => { guests = Math.max(guests-1, 1); document.getElementById('guest-count').textContent = guests; });

  let currentUser = null;
  let reservationsListenerUid = null;
  const TABLE_CAPACITY = 12; // total tables available per timeslot

  watchAuth((user) => {
    currentUser = user;
    document.getElementById('account-link').href = user ? 'account.html' : 'login.html';
    if (user) {
      if (reservationsListenerUid !== user.uid) { reservationsListenerUid = user.uid; watchMyReservations(user.uid); }
    } else {
      reservationsListenerUid = null;
      document.getElementById('my-reservations').innerHTML = `<div class="empty-state"><div class="icon">📅</div>Sign in to see your bookings.</div>`;
    }
  });

  function watchMyReservations(uid) {
    const wrap = document.getElementById('my-reservations');
    wrap.innerHTML = `<div class="skeleton" style="height:200px"></div>`;
    onSnapshot(query(collection(db, 'reservations'), where('userId', '==', uid)), (snap) => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
      if (!list.length) { wrap.innerHTML = `<div class="empty-state"><div class="icon">📅</div>No reservations yet.</div>`; return; }
      wrap.innerHTML = list.map(r => `
        <div class="res-item">
          <div class="flex justify-between items-center" style="margin-bottom:var(--sp-2)">
            <strong>${formatDate(r.date)} · ${r.time}</strong>
            <span class="badge ${statusBadge(r.status)}">${r.status}</span>
          </div>
          <div class="text-muted" style="font-size:var(--text-sm)">${r.guests} guests${r.notes ? ' · ' + escapeHtml(r.notes) : ''}</div>
          ${r.status !== 'cancelled' ? `<button class="btn btn-ghost btn-sm" data-cancel="${r.id}" style="margin-top:var(--sp-2);color:var(--color-danger)">Cancel</button>` : ''}
        </div>`).join('');
      wrap.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async () => {
        const ok = await confirmDialog({ title: 'Cancel reservation?', message: 'This will free up your table for other guests.', confirmLabel: 'Cancel reservation', danger: true });
        if (!ok) return;
        const target = list.find(x => x.id === b.dataset.cancel);
        try {
          await updateDoc(doc(db, 'reservations', b.dataset.cancel), { status: 'cancelled' });
          if (target?.slotKey) {
            try { await updateDoc(doc(db, 'availability', target.slotKey), { count: increment(-1) }); }
            catch (e) { console.warn('Could not release availability slot', e); }
          }
          showToast('Reservation cancelled', 'success');
        } catch (err) {
          console.error(err);
          showToast('Could not cancel: ' + (err.code || err.message), 'error');
        }
      }));
    }, (err) => {
      console.error(err);
      wrap.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>Couldn't load reservations (${err.code || err.message}).</div>`;
    });
  }
  function statusBadge(s) { return { pending:'badge-warning', confirmed:'badge-success', cancelled:'badge-danger', rejected:'badge-danger' }[s] || 'badge-muted'; }

  document.getElementById('res-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const date = document.getElementById('res-date').value;
    const time = timeSelect.value;
    const notes = document.getElementById('res-notes').value.trim();
    let valid = true;
    document.getElementById('date-field').classList.toggle('has-error', !date);
    if (!date) valid = false;
    if (!valid) return;

    if (!currentUser) {
      const go = await confirmDialog({ title: 'Sign in required', message: 'Create an account or sign in to reserve a table.', confirmLabel: 'Go to sign in' });
      if (go) window.location.href = 'login.html?redirect=reservations.html';
      return;
    }

    const btn = document.getElementById('res-submit');
    btn.disabled = true; btn.textContent = 'Checking availability…';
    try {
      // Prevent double-booking without needing broad read access to every
      // customer's reservations (which the security rules correctly forbid
      // for non-admins): check & reserve a slot atomically against a small
      // public availability counter instead.
      const slotKey = `${date}_${time}`;
      const availRef = doc(db, 'availability', slotKey);
      let slotFull = false;
      await runTransaction(db, async (tx) => {
        const availSnap = await tx.get(availRef);
        const count = availSnap.exists() ? (availSnap.data().count || 0) : 0;
        if (count >= TABLE_CAPACITY) { slotFull = true; return; }
        tx.set(availRef, { slotKey, count: count + 1 }, { merge: true });
      });
      if (slotFull) {
        showToast('That time is fully booked — please choose another slot.', 'error');
        btn.disabled = false; btn.textContent = 'Confirm Reservation';
        return;
      }
      await addDoc(collection(db, 'reservations'), {
        userId: currentUser.uid, customerName: currentUser.displayName || '', customerEmail: currentUser.email,
        date, time, slotKey, guests, notes, status: 'pending', tableAssigned: null, createdAt: serverTimestamp()
      });
      showToast('Reservation requested — you\'ll get a confirmation shortly.', 'success');
      e.target.reset();
      document.getElementById('res-date').value = new Date().toISOString().split('T')[0];
    } catch (err) {
      console.error(err); showToast('Could not complete your reservation: ' + (err.code || err.message), 'error');
    }
    btn.disabled = false; btn.textContent = 'Confirm Reservation';
  });
</script>
</body>
</html>
