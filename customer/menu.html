<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Ember & Salt</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
  .menu-toolbar { position: sticky; top: var(--header-h); z-index: 50; background: var(--color-bg); padding: var(--sp-4) 0; border-bottom: 1px solid var(--color-line); }
  .table-banner { background: var(--color-ember); color: #fff; text-align: center; padding: var(--sp-2); font-size: var(--text-sm); font-weight: 600; }
  .meal-photo { height: 190px; object-fit: cover; background: var(--color-bg-sunken); width: 100%; }
  .meal-body { padding: var(--sp-5); }
  .meal-price { font-family: var(--font-mono); color: var(--color-ember); font-weight: 700; }
  .meal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-6); }
  @media (max-width: 900px) { .meal-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .meal-grid { grid-template-columns: 1fr; } }
  .filter-chip { padding: 0.5rem 1rem; border-radius: var(--radius-pill); border: 1px solid var(--color-line-strong); font-size: var(--text-sm); font-weight: 600; white-space: nowrap; }
  .filter-chip.active { background: var(--color-char); color: var(--color-bg); border-color: var(--color-char); }
  .fav-btn { position: absolute; top: var(--sp-3); right: var(--sp-3); background: rgba(255,255,255,0.85); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .meal-photo-wrap { position: relative; }
  .allergen-tag { font-size: var(--text-xs); padding: 0.2rem 0.55rem; border-radius: var(--radius-pill); background: var(--color-bg-sunken); color: var(--color-ink-muted); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container flex items-center justify-between" style="width:100%">
    <a href="../index.html" class="logo">Ember<span class="accent">&</span>Salt</a>
    <nav class="nav-links">
      <a href="../index.html#story">Our Story</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="../index.html#gallery">Gallery</a>
      <a href="reservations.html">Reservations</a>
      <a href="../index.html#contact">Contact</a>
    </nav>
    <div class="nav-cta">
      <button class="theme-toggle" data-theme-toggle>🌙</button>
      <a href="cart.html" class="icon-btn" title="Cart">🛒<span class="cart-count" data-cart-count style="display:none">0</span></a>
      <a href="login.html" class="icon-btn" id="account-link" title="Account">👤</a>
      <button class="mobile-menu-btn icon-btn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<div class="table-banner" id="table-banner" style="display:none"></div>

<div class="menu-toolbar">
  <div class="container">
    <div class="flex gap-3" style="margin-bottom:var(--sp-4)">
      <div class="input-group" style="flex:1">
        <span class="icon">🔍</span>
        <input class="input" id="search-input" placeholder="Search dishes, ingredients…">
      </div>
      <select class="input" id="order-type-select" style="max-width:170px">
        <option value="dine_in">Dine In</option>
        <option value="pickup">Pickup</option>
        <option value="delivery">Delivery</option>
      </select>
    </div>
    <div class="flex gap-2" id="category-filters" style="overflow-x:auto"></div>
  </div>
</div>

<main class="section">
  <div class="container">
    <div class="meal-grid" id="meal-grid">
      <!-- populated by JS -->
    </div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="icon">🍽️</div>
      <p>No dishes match your search or filters.</p>
    </div>
  </div>
</main>

<script type="module">
  import { initTheme, initMobileNav, showToast, openModal, skeletonCards, debounce, escapeHtml } from '../js/modules/ui.js';
  import { fetchCategories, fetchMeals, filterMeals } from '../js/modules/menu-data.js';
  import { addToCart, setOrderType, setTableNumber, getCart } from '../js/modules/cart.js';
  import { watchAuth } from '../js/modules/auth.js';

  initTheme(); initMobileNav();

  watchAuth((user) => {
    document.getElementById('account-link').href = user ? 'account.html' : 'login.html';
  });

  // QR / table param support: menu.html?table=12
  const params = new URLSearchParams(window.location.search);
  const table = params.get('table');
  const initialCategory = params.get('category') || 'all';
  if (table) {
    setTableNumber(table);
    setOrderType('dine_in');
    const banner = document.getElementById('table-banner');
    banner.style.display = 'block';
    banner.textContent = `You're ordering for Table ${table} — no login needed until checkout.`;
    document.getElementById('order-type-select').value = 'dine_in';
  } else {
    document.getElementById('order-type-select').value = getCart().orderType || 'pickup';
  }
  document.getElementById('order-type-select').addEventListener('change', (e) => setOrderType(e.target.value));

  let allMeals = [], allCategories = [];
  let state = { search: '', category: initialCategory };

  async function init() {
    document.getElementById('meal-grid').innerHTML = skeletonCards(6, '300px');
    try {
      [allCategories, allMeals] = await Promise.all([fetchCategories(), fetchMeals({ onlyAvailable: true })]);
    } catch (err) {
      console.error(err);
      document.getElementById('meal-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">⚠️</div>Couldn't load the menu. Check your Firebase config in js/firebase/config.js.</div>`;
      return;
    }
    renderFilters();
    render();
  }

  function renderFilters() {
    const el = document.getElementById('category-filters');
    const cats = [{ id: 'all', name: 'All' }, ...allCategories];
    el.innerHTML = cats.map(c => `
      <button class="filter-chip ${state.category === c.id ? 'active' : ''}" data-cat="${c.id}">
        ${escapeHtml(c.name)}
      </button>`).join('');
    el.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => {
      state.category = btn.dataset.cat;
      renderFilters(); render();
    }));
  }

  function render() {
    const filtered = filterMeals(allMeals, { search: state.search, categoryId: state.category });
    const grid = document.getElementById('meal-grid');
    const empty = document.getElementById('empty-state');
    if (!filtered.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    grid.innerHTML = filtered.map(m => `
      <div class="card card-flush card-hover">
        <div class="meal-photo-wrap">
          <img class="meal-photo" src="${m.imageUrl || ''}" alt="${escapeHtml(m.name)}" loading="lazy">
          <button class="fav-btn" data-fav="${m.id}" title="Save to favorites">🤍</button>
        </div>
        <div class="meal-body">
          <div class="flex justify-between items-center" style="margin-bottom:var(--sp-2)">
            <h4 style="font-size:var(--text-lg)">${escapeHtml(m.name)}</h4>
            <span class="meal-price">$${(m.price || 0).toFixed(2)}</span>
          </div>
          <p class="text-muted" style="font-size:var(--text-sm);margin-bottom:var(--sp-3);min-height:2.6em">${escapeHtml((m.description || '').slice(0, 80))}</p>
          <div class="flex gap-2" style="margin-bottom:var(--sp-4);flex-wrap:wrap">
            ${(m.allergens || []).slice(0,3).map(a => `<span class="allergen-tag">${escapeHtml(a)}</span>`).join('')}
          </div>
          <div class="flex gap-2">
            <button class="btn btn-outline btn-sm" data-detail="${m.id}" style="flex:1">Details</button>
            <button class="btn btn-primary btn-sm" data-add="${m.id}" style="flex:1">Add</button>
          </div>
        </div>
      </div>`).join('');

    grid.querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', () => {
      const meal = allMeals.find(m => m.id === btn.dataset.add);
      addToCart({ mealId: meal.id, name: meal.name, price: meal.price, imageUrl: meal.imageUrl, qty: 1 });
    }));
    grid.querySelectorAll('[data-detail]').forEach(btn => btn.addEventListener('click', () => openDetail(btn.dataset.detail)));
  }

  function openDetail(id) {
    const m = allMeals.find(x => x.id === id);
    if (!m) return;
    const { close } = openModal(`
      <div class="modal-header"><h3 class="font-display">${escapeHtml(m.name)}</h3><button class="modal-close" data-close-modal>&times;</button></div>
      <img class="meal-photo" src="${m.imageUrl || ''}" alt="${escapeHtml(m.name)}" style="border-radius:var(--radius-md);margin-bottom:var(--sp-4);height:220px">
      <p style="margin-bottom:var(--sp-4)">${escapeHtml(m.description || '')}</p>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-bottom:var(--sp-4)">
        <div>
          <h4 style="font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.06em;color:var(--color-ink-muted);margin-bottom:var(--sp-2)">Ingredients</h4>
          <p style="font-size:var(--text-sm)">${(m.ingredients || []).map(escapeHtml).join(', ') || '—'}</p>
        </div>
        <div>
          <h4 style="font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.06em;color:var(--color-ink-muted);margin-bottom:var(--sp-2)">Allergens</h4>
          <div class="flex gap-2" style="flex-wrap:wrap">${(m.allergens || []).map(a => `<span class="allergen-tag">${escapeHtml(a)}</span>`).join('') || '<span class="text-muted" style="font-size:var(--text-sm)">None listed</span>'}</div>
        </div>
      </div>
      ${m.nutrition ? `
      <h4 style="font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.06em;color:var(--color-ink-muted);margin-bottom:var(--sp-2)">Nutrition (per serving)</h4>
      <div class="flex gap-4" style="margin-bottom:var(--sp-5);font-family:var(--font-mono);font-size:var(--text-sm)">
        <span>${m.nutrition.calories || 0} kcal</span><span>${m.nutrition.protein || 0}g protein</span><span>${m.nutrition.carbs || 0}g carbs</span><span>${m.nutrition.fat || 0}g fat</span>
      </div>` : ''}
      <div class="flex justify-between items-center">
        <span class="meal-price" style="font-size:var(--text-xl)">$${(m.price || 0).toFixed(2)}</span>
        <button class="btn btn-primary" id="modal-add">Add to cart</button>
      </div>
    `);
    document.getElementById('modal-add').addEventListener('click', () => {
      addToCart({ mealId: m.id, name: m.name, price: m.price, imageUrl: m.imageUrl, qty: 1 });
      close();
    });
  }

  document.getElementById('search-input').addEventListener('input', debounce((e) => {
    state.search = e.target.value; render();
  }, 250));

  init();
</script>
</body>
</html>
